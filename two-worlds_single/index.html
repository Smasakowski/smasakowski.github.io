<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Worlds – Steve Masakowski</title>

  <!-- Open Graph meta tags -->
  <meta property="og:title" content="Two Worlds – Steve Masakowski">
  <meta property="og:description" content="Out now on Spotify, Apple Music, and more!">
  <meta property="og:image" content="https://yourwebsite.com/EPK/images/album_cover.jpeg">
  <meta property="og:url" content="https://yourwebsite.com/landing-page.html">
  <meta property="og:type" content="music.song">

  <!-- Optional Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Two Worlds – Steve Masakowski">
  <meta name="twitter:description" content="Out now on Spotify, Apple Music, and more!">
  <meta name="twitter:image" content="https://yourwebsite.com/EPK/images/album_cover.jpeg">


  <!-- Meta Pixel / Conversion tracking placeholder -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'YOUR_PIXEL_ID');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;

      background: linear-gradient(135deg, #7db9d1, #0b6357, #162447);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 480px;
      padding: 2rem;
      text-align: center;
    }

    img {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 0px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.8;
      margin-bottom: 1.5rem;
    }

    /* Streaming links container */
    .streaming-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .streaming-links a {
      display: inline-block;
      background: #1DB954;
      color: black;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .streaming-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(29,185,84,0.35);
    }

    .small {
      margin-top: 1rem;
      font-size: 14px;
      opacity: 0.6;
    }

    input[type="email"] {
      padding: 12px;
      width: 70%;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    button.submit {
      padding: 12px 20px;
      background: #1DB954;
      color: black;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(29,185,84,0.35);
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Cover Art -->
    <img src="../EPK/images/album_cover.jpeg" alt="Release Artwork">

    <!-- Title & Info -->
    <h1>Two Worlds</h1>
    <p>Out now on your favorite platforms 🌊</p>

    <!-- Streaming Links -->
    <div class="streaming-links">
      <a href="https://open.spotify.com/playlist/2YOC4IB68CN5B9qCyKYO4k?si=a2ceb38a8f1a4026" target="_blank" onclick="fbq('track', 'Lead');">Spotify</a>
      <a href="APPLE_MUSIC_LINK" target="_blank">Apple Music</a>
      <a href="YOUTUBE_MUSIC_LINK" target="_blank">YouTube Music</a>
      <a href="TIDAL_LINK" target="_blank">Tidal</a>
      <a href="AMAZON_MUSIC_LINK" target="_blank">Amazon Music</a>
      <a href="DEEZER_LINK" target="_blank">Deezer</a>
      <a href="BANDCAMP_LINK" target="_blank">Bandcamp</a>
      <a href="SOUNDCLOUD_LINK" target="_blank">SoundCloud</a>
    </div>

    <!-- Optional Email Capture -->
    <form id="emailForm" onsubmit="submitEmail(event)">
      <input type="email" id="email" placeholder="Your email for updates" required>
      <button type="submit" class="submit">Sign Up</button>
    </form>

    <div class="small">
      Thank you for supporting independent music ❤️
    </div>
  </div>

  <script>
    function submitEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Thanks! ${email} has been added to the mailing list.`);
      fbq('track', 'CompleteRegistration');
      document.getElementById('emailForm').reset();
    }
  </script>
</body>
</html>
