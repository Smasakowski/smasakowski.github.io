  <!-- Meta Pixel / Conversion tracking placeholder -->

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      background: linear-gradient(135deg, #7db9d1, #0b6357, #162447);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 480px;
      padding: 2rem;
      text-align: center;
    }

    .cover-art {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 0;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.8;
      margin-bottom: 1.5rem;
    }

    .streaming-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .streaming-links a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      backdrop-filter: blur(6px);
    }

    .streaming-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.22);
    }

    .streaming-links img.platform-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
      background: #fff;
      border-radius: 4px;
      padding: 3px;
    }

    .small {
      margin-top: 1rem;
      font-size: 14px;
      opacity: 0.6;
    }

    input[type="email"] {
      padding: 12px;
      width: 70%;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    button.submit {
      padding: 12px 20px;
      background: #1DB954;
      color: black;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(29,185,84,0.35);
    }

    @media (max-width: 520px) {
      .container {
        padding: 1.5rem;
      }

      .streaming-links a {
        width: 100%;
        justify-content: center;
      }

      input[type="email"] {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Cover Art -->
    <img class="cover-art" src="../EPK/images/album_cover.jpeg" alt="Release Artwork">

    <!-- Title & Info -->
    <h1>Two Worlds</h1>
    <p>Out now on your favorite platforms 🌊</p>

    <!-- Streaming Links -->
    <div class="streaming-links">
      <a href="https://open.spotify.com/track/3cBBF38RVMKqkVFuHVgb5S" target="_blank" onclick="fbq('track', 'Lead');">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/spotify.svg" alt="Spotify icon">
        <span>Spotify</span>
      </a>

      <a href="https://stevemasakowski.bandcamp.com/track/two-worlds" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/bandcamp.svg" alt="Bandcamp icon">
        <span>Bandcamp</span>
      </a>

      <a href="https://www.pandora.com/TR:195139866" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/pandora.svg" alt="Pandora icon">
        <span>Pandora</span>
      </a>

      <a href="https://listen.tidal.com/track/502653531" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/tidal.svg" alt="Tidal icon">
        <span>Tidal</span>
      </a>

      <!-- Uncomment and add your URLs when ready -->
      <!--
      <a href="APPLE_MUSIC_LINK" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/applemusic.svg" alt="Apple Music icon">
        <span>Apple Music</span>
      </a>

      <a href="YOUTUBE_MUSIC_LINK" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/youtubemusic.svg" alt="YouTube Music icon">
        <span>YouTube Music</span>
      </a>

      <a href="AMAZON_MUSIC_LINK" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/amazonmusic.svg" alt="Amazon Music icon">
        <span>Amazon Music</span>
      </a>

      <a href="DEEZER_LINK" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/deezer.svg" alt="Deezer icon">
        <span>Deezer</span>
      </a>

      <a href="SOUNDCLOUD_LINK" target="_blank">
        <img class="platform-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/soundcloud.svg" alt="SoundCloud icon">
        <span>SoundCloud</span>
      </a>
      -->
    </div>

    <!-- Optional Email Capture -->
    <form id="emailForm" onsubmit="submitEmail(event)">
      <input type="email" id="email" placeholder="Your email for updates" required>
      <button type="submit" class="submit">Sign Up</button>
    </form>

    <div class="small">
      Thank you for supporting independent music ❤️
    </div>
  </div>

  <script>
    function submitEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Thanks! ${email} has been added to the mailing list.`);
      fbq('track', 'CompleteRegistration');
      document.getElementById('emailForm').reset();
    }
  </script>
</body>
</html>
